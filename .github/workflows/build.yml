name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Compile bot
      run: |
        cl /EHsc /Fe:MTA_Bot.exe main.cpp /link psapi.lib user32.lib
      
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: MTA_Bot
        path: MTA_Bot.exe
        retention-days: 30
