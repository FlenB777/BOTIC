name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup MinGW
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64
        
    - name: Compile bot
      run: |
        g++ -static -O2 -fexec-charset=CP1251 -finput-charset=UTF-8 main.cpp -o MTA_Bot.exe -lpsapi -lstdc++ -luser32 -ladvapi32 -lkernel32
        
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: connector
        path: connector.exe
        retention-days: 30
